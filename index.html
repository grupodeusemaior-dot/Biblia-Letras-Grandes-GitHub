<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b55">
  <meta name="description" content="Bíblia Sagrada em letras grandes — Renova-me Deus Meu.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bíblia Letras Grandes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Bíblia — Letras Grandes | Renova-me Deus Meu</title>
</head>
<body>
<header class="top">
  <div class="brand"><img src="./icons/icon-192.png" alt=""><div><strong>BÍBLIA</strong><span>LETRAS GRANDES</span></div></div>
  <div class="font-tools" aria-label="Tamanho do texto">
    <button id="fontDown" aria-label="Diminuir letras">A−</button>
    <button id="fontUp" aria-label="Aumentar letras">A+</button>
  </div>
</header>
<main>
  <section class="welcome" id="welcome">
    <h1>Leia a Palavra de Deus com conforto.</h1>
    <p>Escolha um testamento para começar.</p>
    <div class="testaments">
      <button class="testament" data-testament="Antigo Testamento"><span>ANTIGO</span><strong>Testamento</strong><small>39 livros</small></button>
      <button class="testament" data-testament="Novo Testamento"><span>NOVO</span><strong>Testamento</strong><small>27 livros</small></button>
    </div>
  </section>
  <section id="booksView" class="view" hidden>
    <button class="back" id="backHome">← Voltar aos testamentos</button>
    <h1 id="booksTitle"></h1><p>Escolha um livro.</p><div id="booksList" class="book-grid"></div>
  </section>
  <section id="chaptersView" class="view" hidden>
    <button class="back" id="backBooks">← Voltar aos livros</button>
    <h1 id="chaptersTitle"></h1><p>Escolha um capítulo.</p><div id="chaptersList" class="chapter-grid"></div>
  </section>
  <section id="readingView" class="view" hidden>
    <button class="back" id="backChapters">← Voltar aos capítulos</button>
    <div class="reading-heading"><h1 id="readingTitle"></h1><span id="translation"></span></div>
    <div id="selectionTools" class="selection-tools" hidden aria-label="Ferramentas de estudo">
      <span class="selection-hint">Texto selecionado</span>
      <button type="button" id="highlightSelection">🖍 Marcar</button>
      <button type="button" id="removeHighlight">Apagar marcação</button>
      <button type="button" id="annotateSelection">📝 Anotar</button>
    </div>
    <article id="verses" class="verses"></article>
    <aside id="notePanel" class="note-panel" hidden aria-live="polite">
      <div class="note-panel-head"><strong>Minha anotação</strong><button type="button" id="closeNotePanel" aria-label="Fechar anotação">×</button></div>
      <p id="notePanelQuote" class="note-quote"></p>
      <p id="notePanelContent"></p>
      <div class="note-actions"><button type="button" id="editNote">Editar</button><button type="button" id="deleteNote" class="danger">Apagar</button></div>
    </aside>
    <nav class="chapter-nav"><button id="previousChapter">← Anterior</button><button id="nextChapter">Próximo →</button></nav>
  </section>
</main>
<dialog id="noteDialog" class="note-dialog">
  <form id="noteForm" method="dialog">
    <h2 id="noteDialogTitle">Nova anotação</h2>
    <p id="noteDialogQuote" class="note-quote"></p>
    <label for="noteInput">Sua anotação</label>
    <textarea id="noteInput" rows="5" maxlength="3000" placeholder="Escreva sua reflexão sobre este trecho..."></textarea>
    <div class="dialog-actions">
      <button type="button" id="cancelNote">Cancelar</button>
      <button type="submit" id="saveNote" class="primary">Salvar anotação</button>
    </div>
  </form>
</dialog>
<footer><strong>Renova-me Deus Meu</strong><span>Palavra, fé e vida</span></footer>
<script src="./app.js"></script>
</body>
</html>
